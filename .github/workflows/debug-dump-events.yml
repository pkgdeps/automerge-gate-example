# Debug: dump every pull_request-related event payload.
# Used to check which events (e.g. auto_merge_enabled) arrive for stacked PRs.
name: debug-dump-events

on:
  pull_request:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - ready_for_review
      - locked
      - unlocked
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled
      - milestoned
      - demilestoned
      - enqueued
      - dequeued
      - stacked
  pull_request_target:
    types:
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - opened
      - edited
      - closed
      - reopened
      - synchronize
      - converted_to_draft
      - ready_for_review
      - locked
      - unlocked
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled
      - milestoned
      - demilestoned
      - enqueued
      - dequeued
      - stacked
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

# Every event must be recorded, so each run gets its own group and nothing is cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dump event
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
        run: |
          {
            echo "## ${EVENT_NAME} / ${EVENT_ACTION}"
            echo ""
            echo "- PR: #${PR_NUMBER} (${HEAD_REF} -> ${BASE_REF})"
            echo "- github.ref: ${GITHUB_REF}"
            echo "- workflow_ref: ${WORKFLOW_REF}"
            echo "- workflow_sha: ${WORKFLOW_SHA}"
            echo "- stack: ${STACK}"
            echo ""
            echo '```json'
            jq . "$GITHUB_EVENT_PATH"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "event=${EVENT_NAME} action=${EVENT_ACTION} pr=#${PR_NUMBER} ${HEAD_REF} -> ${BASE_REF}"
          jq . "$GITHUB_EVENT_PATH"
