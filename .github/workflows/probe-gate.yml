# Public-mode gate used only to observe PR #41. Its job name is not the
# required check, so it never allows a merge.
name: probe-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  probe-gate:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: pkgdeps/automerge-gate@v5.0.1
        with:
          gate-mode: 'public'
          poll-interval-seconds: '10'
      - name: Dump check runs, annotations and workflow runs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "::group::check-runs"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=all&per_page=100" \
            --jq '.check_runs[] | {id, name, status, conclusion, started_at, completed_at, suite: .check_suite.id, app: .app.slug, details_url}'
          echo "::endgroup::"
          echo "::group::annotations of cancelled runs"
          for id in $(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?filter=all&per_page=100" --jq '.check_runs[] | select(.conclusion=="cancelled") | .id'); do
            echo "check_run $id:"
            gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[] | {annotation_level, title, message, path}'
          done
          echo "::endgroup::"
          echo "::group::workflow runs"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | {id, name, path, event, status, conclusion, run_attempt, check_suite_id, created_at}'
          echo "::endgroup::"
