name: automerge-gate

on:
  pull_request:
    types: [opened, synchronize, reopened, auto_merge_enabled, stacked]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      github.event_name != 'pull_request_review'
      || github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      statuses: write
      checks: read
      pull-requests: read
      actions: read
    steps:
      - uses: pkgdeps/automerge-gate@139428e45add7c6e6c9d673d5a9b6034e9d7439b # feat/poll-stacked-prs (pkgdeps/automerge-gate#54)
        with:
          gate-mode: 'private'
          poll-on-stacked-pull-requests: 'true'
          context: 'automerge-gate/all-passed'
          poll-interval-seconds: '15'
          ignore-apps: |
            vercel
